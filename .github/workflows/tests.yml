name: unit-tests

on:
  push:
    branches: [master, main, 'hotfix/**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---- 常规单元/集成测试（原生构建，最快）----
  qt6-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make

      - name: Configure (qmake6)
        run: |
          mkdir -p build/tests
          cd build/tests
          qmake6 ../../tests/tests.pro

      - name: Build tests
        run: |
          cd build/tests
          make -j"$(nproc)"

      - name: Run tests
        run: ./build/tests/fieldlink_tests

  # ---- 内存检查（ASan + LeakSanitizer + UBSan）----
  # 说明：内存检查只在 Linux 上可行（MinGW/Windows 无 libasan）。
  #       被测对象是 tests/ 下的无 GUI 测试套件。
  #
  # 2026-10：曾并行跑一个 Valgrind 作业，因其报告的 8 条
  #「Conditional jump depends on uninitialised value」经地址范围核对确认
  # 全部落在 Qt 共享库内（报错地址 0x930156F~0x98C398F，而本项目二进制
  # 仅 532KB），且安装 Qt dbgsym 后堆栈仍无法符号化（持续显示???），
  # 属 Qt 自身在 Valgrind 下的已知误报、无可操作性，故已移除该作业。
  # 内存检查能力改由 ASan（越界/释放后使用/泄漏）+ UBSan（未定义行为）承担。
  asan-leak:
    name: ASan + UBSan + LeakSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make

      - name: Configure with sanitizers
        run: |
          mkdir -p build/asan
          cd build/asan
          # ASan: 堆越界、释放后使用、内存泄漏
          # UBSan: 未定义行为（整数溢出、非法移位、对齐、越界数组索引等）
          # 两者合并运行，并开启 recover 以便一次跑出全部问题而非只报首个
          qmake6 ../../tests/tests.pro \
            "QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g" \
            "QMAKE_LFLAGS+=-fsanitize=address,undefined"

      - name: Build tests (sanitizers)
        run: |
          cd build/asan
          make -j"$(nproc)"

      - name: Run tests under ASan/UBSan/LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: report_objects=1
          # UBSan 遇错即退出并返回非 0，配合 -fno-sanitize-recover=undefined
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/asan/fieldlink_tests
          echo "ASan/UBSan/LSan: 内存泄漏、越界访问与未定义行为均未检出"
