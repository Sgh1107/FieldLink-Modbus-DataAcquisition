name: unit-tests

on:
  push:
    branches: [master, main, 'hotfix/**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---- 常规单元/集成测试（原生构建，最快）----
  qt6-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make

      - name: Configure (qmake6)
        run: |
          mkdir -p build/tests
          cd build/tests
          qmake6 ../../tests/tests.pro

      - name: Build tests
        run: |
          cd build/tests
          make -j"$(nproc)"

      - name: Run tests
        run: ./build/tests/fieldlink_tests

  # ---- 内存检查（ASan + LeakSanitizer）：泄漏即失败 ----
  # 说明：内存检查只在 Linux 上可行（MinGW/Windows 无 libasan，也没有 Valgrind），
  #       被测对象是 tests/ 下的无 GUI 测试套件。
  asan-leak:
    name: ASan + LeakSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make

      - name: Configure with AddressSanitizer
        run: |
          mkdir -p build/asan
          cd build/asan
          qmake6 ../../tests/tests.pro \
            "QMAKE_CXXFLAGS+=-fsanitize=address -fno-omit-frame-pointer -g" \
            "QMAKE_LFLAGS+=-fsanitize=address"

      - name: Build tests (ASan)
        run: |
          cd build/asan
          make -j"$(nproc)"

      - name: Run tests under ASan/LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: report_objects=1
        run: |
          ./build/asan/fieldlink_tests
          echo "ASan/LSan: no memory leaks detected"

  # ---- 内存检查（Valgrind Memcheck）：非法读写 + 确定性泄漏即失败 ----
  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 + Valgrind (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make valgrind

      # 单独一步装 Qt 调试符号：失败只告警，绝不影响主流程。
      # 背景：静态链接的 Qt 库无符号时 Valgrind 堆栈全是 ???，无法定位问题。
      # 注意 ddebs.ubuntu.com 必须先导入其 GPG 公钥，否则 apt-get update 会因
      # 「The repository is not signed」整体失败（exit 100），把 CI 直接搞挂
      # ——2026-10 就因此白跑了一轮。此处所有命令都容错，绝不阻断。
      - name: Install Qt debug symbols (best-effort)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          # ddebs 的签名公钥（Ubuntu 归档官方公钥）
          curl -fsSL https://keyserver.ubuntu.com/pks/lookup?op=get\&search=0x843938DF228D22F7B3742BC0D94AA3F0EFE21092 \
            | gpg --dearmor -o /usr/share/keyrings/ddebs-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ddebs-archive-keyring.gpg] http://ddebs.ubuntu.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ddebs.list
          sudo apt-get update -o Acquire::AllowInsecureRepositories=false
          sudo apt-get install -y qt6-base-dev-dbgsym
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Qt dbgsym 安装失败（rc=$rc），Qt 内部堆栈将显示 ???"
          else
            echo "Qt dbgsym installed"
          fi
          exit 0

      - name: Configure (qmake6, debug + 调试信息)
        run: |
          mkdir -p build/vg
          cd build/vg
          # 说明：qmake 的 "QMAKE_CXXFLAGS+=-g" 是追加而非覆盖，之前已能带上 -g；
          # 堆栈仍显示 ??? 的真正原因是静态链接的 Qt 库自身没有调试信息
          #（靠上面安装 dbgsym 解决），而非我们代码缺少 -g。
          # 保留 release 优化不做成 debug：-O2 会内联并让 Valgrind 堆栈更易读，
          # 且能检查真实发布形态的代码路径。
          qmake6 ../../tests/tests.pro "QMAKE_CXXFLAGS+=-g -gdwarf-4"

      - name: Build tests (debug info)
        run: |
          cd build/vg
          make -j"$(nproc)"
          # 自检：我们自己的二进制必须带调试信息（Qt 库的符号靠上面的 dbgsym 包）。
          # 二进制可能落在 release/ 或子目录，故用 find 定位而非写死路径。
          BIN=$(find . -name fieldlink_tests -type f -perm -u+x | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::未找到 fieldlink_tests 可执行文件"
            exit 1
          fi
          echo "binary: $BIN"
          if readelf -S "$BIN" | grep -q debug_info; then
            echo "our debug info: present"
          else
            echo "::error::二进制缺少 .debug_info，Valgrind 无法给出堆栈"
            exit 1
          fi

      # 符号化能力自检：直接问 Valgrind 能否解析出一个已知 Qt 符号。
      # 这样即使后续 Valgrind 仍报未初始化值，也能从本步日志立刻判断
      #「是符号没装好导致堆栈不可读」还是「确实有别的问题」。
      - name: Verify Valgrind can symbolize
        continue-on-error: true
        run: |
          set +e
          BIN=$(find build/vg -name fieldlink_tests -type f -perm -u+x | head -1)
          if [ -z "$BIN" ]; then
            echo "::warning::未找到二进制，跳过符号化自检"
            exit 0
          fi
          # nm 看能否列出符号（静态库已链接进二进制时应能列出我们自己的函数）
          if nm -C "$BIN" 2>/dev/null | grep -q "PointModel\|DataExporter"; then
            echo "symbolize: our own symbols resolvable"
          else
            echo "::warning::nm 无法列出本项目符号，可能是静态库符号表被裁剪"
          fi
          # dbgsym 是否就位（build-id 目录）
          N=$(find /usr/lib/debug/.build-id -name '*.debug' 2>/dev/null | wc -l)
          echo "dbgsym files: $N"
          if [ "$N" -eq 0 ]; then
            echo "::warning::未找到 dbgsym，Qt 内部堆栈将显示 ???"
          fi
          exit 0

      - name: Run tests under Valgrind
        run: |
          # -s 打印每条错误的完整堆栈：缺失时 CI 只能看到 "ERROR SUMMARY: N errors"。
          # --undef-value-errors=yes 显式声明检查未初始化值（默认即开，此处明示意图）。
          # --read-var-info=yes 让 Valgrind 能报告「哪个变量未初始化」。
          # --demangle=yes 保证 C++ 符号名可读（否则函数名显示成 _Z 开头的乱码）。
          # --trace-children=no，避免测试里启动的子进程干扰归因。
          # --keep-debuginfo=yes 让 Valgrind 尝试从系统调试符号目录解析 Qt 内部符号；
          # 若 dbgsym 未装上，此项不会报错，只是 Qt 内部堆栈仍为???（不阻断）。
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-leak-kinds=definite,indirect \
                   --errors-for-leak-kinds=definite,indirect \
                   --track-origins=yes \
                   --undef-value-errors=yes \
                   --read-var-info=yes \
                   --demangle=yes \
                   --trace-children=no \
                   --keep-debuginfo=yes \
                   --num-callers=25 \
                   --error-exitcode=1 \
                   -s \
                   ./build/vg/fieldlink_tests
          echo "Valgrind: no definite/indirect leaks, no invalid memory access"
