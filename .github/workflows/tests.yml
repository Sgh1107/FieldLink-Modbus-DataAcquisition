name: unit-tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  qt6-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite \
            libqt6serialport6-dev libqt6serialbus6-dev g++ make

      - name: Configure (qmake6)
        run: |
          mkdir -p build/tests
          cd build/tests
          qmake6 ../../tests/tests.pro

      - name: Build tests
        run: |
          cd build/tests
          make -j"$(nproc)"

      - name: Run tests
        run: ./build/tests/fieldlink_tests